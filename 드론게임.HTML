<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRONE MOBILE GAME</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
touch-action:none;
}

body{
background:black;
overflow:hidden;
}

/* 상단 */

header{

width:100%;
padding:15px;

background:
linear-gradient(to right,#0f172a,#16a34a);

color:white;

display:flex;
justify-content:space-around;
align-items:center;

}

header h1{

font-size:28px;

}

.box{

background:rgba(255,255,255,0.15);

padding:10px 20px;

border-radius:15px;

font-size:18px;
font-weight:bold;

}

/* 게임 */

#game{

width:100vw;
height:100vh;

position:relative;

overflow:hidden;

background:
linear-gradient(to bottom,#6dd5ff,#ffffff);

}

/* 도시 */

.city{

position:absolute;
bottom:0;

width:100%;
height:120px;

background:
linear-gradient(to top,#222,#555);

}

/* 드론 */

#drone{

width:70px;
height:70px;

position:absolute;

bottom:140px;
left:50%;

transform:translateX(-50%);

font-size:60px;

z-index:10;

transition:0.05s;

}

/* 장애물 */

.obstacle{

position:absolute;

font-size:50px;

}

/* 코인 */

.coin{

position:absolute;

font-size:38px;

animation:spin 1s linear infinite;

}

@keyframes spin{

0%{
transform:rotateY(0deg);
}

100%{
transform:rotateY(360deg);
}

}

/* 하트 */

.heart{

position:absolute;

font-size:36px;

animation:heart 1s infinite alternate;

}

@keyframes heart{

0%{
transform:translateY(0px);
}

100%{
transform:translateY(-8px);
}

}

/* 게임오버 */

#gameOver{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

background:rgba(0,0,0,0.9);

padding:40px;

border-radius:30px;

color:white;

font-size:45px;

display:none;

z-index:100;

text-align:center;

}

/* 다시하기 */

#restart{

margin-top:20px;

padding:15px 35px;

border:none;

border-radius:15px;

background:#16a34a;

color:white;

font-size:22px;

}

/* 버튼 */

.controls{

position:absolute;

bottom:20px;
width:100%;

display:flex;
justify-content:space-between;

padding:0 40px;

z-index:50;

}

.btn{

width:90px;
height:90px;

border-radius:50%;

border:none;

background:rgba(255,255,255,0.2);

backdrop-filter:blur(10px);

color:white;

font-size:45px;

}

.btn:active{

transform:scale(0.9);

background:#16a34a;

}

</style>
</head>

<body>

<header>

<div class="box">
⭐ <span id="score">0</span>
</div>

<div class="box">
❤️ <span id="life">3</span>
</div>

<div class="box">
LEVEL <span id="level">1</span>
</div>

</header>

<div id="game">

<div class="city"></div>

<div id="drone">
🚁
</div>

<div id="gameOver">

GAME OVER

<br>

<button id="restart">
다시하기
</button>

</div>

<!-- 버튼 -->

<div class="controls">

<button class="btn" id="leftBtn">
⬅️
</button>

<button class="btn" id="rightBtn">
➡️
</button>

</div>

</div>

<script>

const game = document.getElementById("game");

const drone = document.getElementById("drone");

const scoreText = document.getElementById("score");

const lifeText = document.getElementById("life");

const levelText = document.getElementById("level");

const gameOver = document.getElementById("gameOver");

const restart = document.getElementById("restart");

const leftBtn = document.getElementById("leftBtn");

const rightBtn = document.getElementById("rightBtn");

/* 상태 */

let x = window.innerWidth / 2 - 35;

let speed = 9;

let score = 0;

let life = 3;

let level = 1;

let playing = true;

let moveLeft = false;

let moveRight = false;

let obstacles = [];

let coins = [];

let hearts = [];

/* 이동 */

function move(){

if(!playing) return;

if(moveLeft){

x -= speed;

}

if(moveRight){

x += speed;

}

if(x < 0){

x = 0;

}

if(x > window.innerWidth - 70){

x = window.innerWidth - 70;

}

drone.style.left = x + "px";

requestAnimationFrame(move);

}

/* 버튼 터치 */

leftBtn.addEventListener("touchstart",()=>{

moveLeft = true;

});

leftBtn.addEventListener("touchend",()=>{

moveLeft = false;

});

rightBtn.addEventListener("touchstart",()=>{

moveRight = true;

});

rightBtn.addEventListener("touchend",()=>{

moveRight = false;

});

/* 장애물 */

function createObstacle(){

const items = ["🪨","🚗","🛢️","📦","🚧"];

const o = document.createElement("div");

o.classList.add("obstacle");

o.innerHTML =
items[Math.floor(Math.random()*items.length)];

let ox =
Math.random()*(window.innerWidth-60);

o.style.left = ox + "px";

o.style.top = "-60px";

game.appendChild(o);

obstacles.push({

el:o,
x:ox,
y:-60,
speed:5+level

});

}

/* 코인 */

function createCoin(){

const c = document.createElement("div");

c.classList.add("coin");

c.innerHTML = "⭐";

let cx =
Math.random()*(window.innerWidth-40);

c.style.left = cx + "px";

c.style.top = "-50px";

game.appendChild(c);

coins.push({

el:c,
x:cx,
y:-50

});

}

/* 하트 */

function createHeart(){

const h = document.createElement("div");

h.classList.add("heart");

h.innerHTML = "💖";

let hx =
Math.random()*(window.innerWidth-40);

h.style.left = hx + "px";

h.style.top = "-50px";

game.appendChild(h);

hearts.push({

el:h,
x:hx,
y:-50

});

}

/* 레벨 */

function updateLevel(){

if(score >= 20){

level = 2;

}

if(score >= 50){

level = 3;

}

if(score >= 100){

level = 4;

}

levelText.innerText = level;

}

/* 루프 */

function loop(){

if(!playing) return;

/* 장애물 */

for(let i=0;i<obstacles.length;i++){

let o = obstacles[i];

o.y += o.speed;

o.el.style.top = o.y+"px";

/* 충돌 */

if(

x < o.x + 50 &&
x + 60 > o.x &&
window.innerHeight - 220 < o.y + 50

){

o.el.remove();

obstacles.splice(i,1);

life--;

lifeText.innerText = life;

navigator.vibrate(100);

if(life <= 0){

end();

}

}

/* 지나감 */

if(o.y > window.innerHeight){

o.el.remove();

obstacles.splice(i,1);

score++;

scoreText.innerText = score;

updateLevel();

}

}

/* 코인 */

for(let i=0;i<coins.length;i++){

let c = coins[i];

c.y += 4;

c.el.style.top = c.y+"px";

if(

x < c.x + 40 &&
x + 60 > c.x &&
window.innerHeight - 220 < c.y + 40

){

score += 5;

scoreText.innerText = score;

c.el.remove();

coins.splice(i,1);

}

}

/* 하트 */

for(let i=0;i<hearts.length;i++){

let h = hearts[i];

h.y += 4;

h.el.style.top = h.y+"px";

if(

x < h.x + 40 &&
x + 60 > h.x &&
window.innerHeight - 220 < h.y + 40

){

life++;

lifeText.innerText = life;

h.el.remove();

hearts.splice(i,1);

}

}

requestAnimationFrame(loop);

}

/* 끝 */

function end(){

playing = false;

gameOver.style.display = "block";

}

/* 다시 */

restart.onclick = ()=>{

location.reload();

};

/* 시작 */

move();

loop();

setInterval(createObstacle,700);

setInterval(createCoin,3000);

setInterval(createHeart,10000);

</script>

</body>
</html>
