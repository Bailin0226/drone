<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드론사진</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5fff7;
}

/* 메뉴 */
nav{
background:#1f9d55;
padding:18px;
}

nav ul{
display:flex;
justify-content:center;
gap:35px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#d6ffe6;
}

/* 콘텐츠 */
.container{
padding:80px 10%;
text-align:center;
}

h1{
font-size:60px;
color:#1f9d55;
margin-bottom:40px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:500px;
object-fit:cover;
border-radius:20px;
transition:0.3s;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.gallery img:hover{
transform:scale(1.03);
}

</style>
</head>
